<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<title>Élan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : appli mobile à onglets (barre fixe en bas), une colonne de 560px max, minuteur en plein écran par-dessus. */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --ink: #141c19;
  --muted: #5d6b66;
  --line: #d6dddb;
  --accent: #2346d8;      /* effort */
  --accent-ink: #ffffff;
  --rest: #b86e00;        /* repos */
  --ok: #1f7a4d;
  --warn: #b5361f;
  --knee: #0f7c86;        /* routine genou */
  --soft: #e3e8f9;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #18201d; --ink: #e9efec; --muted: #98a6a0; --line: #2a3531;
    --accent: #7d97ff; --accent-ink: #0b1030; --rest: #f0a83a; --ok: #5fd39a; --warn: #ff8a73;
    --knee: #4fc7d1; --soft: #1e2744; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #18201d; --ink: #e9efec; --muted: #98a6a0; --line: #2a3531;
  --accent: #7d97ff; --accent-ink: #0b1030; --rest: #f0a83a; --ok: #5fd39a; --warn: #ff8a73;
  --knee: #4fc7d1; --soft: #1e2744; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.section { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.hero-card { background: var(--accent); color: var(--accent-ink); border: 0; }
.hero-card .muted { color: inherit; opacity: .8; }
.knee-card { border-left: 5px solid var(--knee); }
.hard-card { border-left: 5px solid var(--warn); }
.lvl { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bar.xp { height: 10px; }
.bar.xp > i { background: var(--accent); }
button, .btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: var(--soft); color: var(--ink); min-height: 44px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-ink); }
.hero-card .primary { background: var(--accent-ink); color: var(--accent); }
.knee-btn { background: var(--knee); color: var(--surface); }
.ghost { background: transparent; border: 1px solid var(--line); }
.link { background: none; padding: 6px 0; min-height: 0; color: var(--accent); font-weight: 700; }
.danger { color: var(--warn); }
.full { width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.late { background: var(--warn); color: var(--surface); }
.pill.soon { background: var(--rest); color: var(--surface); }
.pill.ok { background: var(--ok); color: var(--surface); }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 2px; }
.item > div { min-width: 0; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; padding: 0; min-height: 0; display: grid; place-items: center; }
.check.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check svg { width: 16px; height: 16px; }
.done .t { text-decoration: line-through; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
.dots { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.dots i { aspect-ratio: 1; border-radius: 4px; background: var(--line); max-width: 100%; }
.dots i.s { background: var(--accent); }
.dots i.k { background: var(--knee); }
.dots i.sk { background: linear-gradient(135deg, var(--accent) 50%, var(--knee) 50%); }
.exlist { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.exlist li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.exlist li:first-child { border-top: 0; }
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; background: transparent; padding: 8px; min-height: 38px; font-size: 14px; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.sources a { color: var(--accent); overflow-wrap: anywhere; }
label { display: grid; gap: 4px; font-size: 14px; font-weight: 700; }
input, select, textarea { font: inherit; font-weight: 400; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-height: 44px; }
textarea { min-height: 90px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
/* Barre d'onglets */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.tabs button { background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; font-size: 12px; color: var(--muted); border-radius: 10px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); }
/* Feuille de saisie */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(520px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); max-height: 88vh; }
dialog::backdrop { background: rgba(10, 16, 14, .5); }
dialog form { padding: 18px; display: grid; gap: 12px; }
/* Minuteur plein écran */
#runner { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
#runner[data-phase="work"] { --ph: var(--accent); }
#runner[data-phase="rest"], #runner[data-phase="prep"] { --ph: var(--rest); }
#runner[data-phase="knee"] { --ph: var(--knee); }
.rn-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rn-mid { display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; max-width: 520px; margin: 0 auto; width: 100%; }
.rn-phase { font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: 14px; color: var(--ph); }
.rn-name { font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1.1; }
.rn-desc { color: var(--muted); max-width: 40ch; }
.ring { position: relative; width: min(68vw, 290px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: var(--ph); transition: stroke-dashoffset .25s linear; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: clamp(54px, 18vw, 86px); font-variant-numeric: tabular-nums; }
.ring .sub { position: absolute; left: 0; right: 0; bottom: 24%; font-size: 15px; color: var(--muted); font-weight: 700; }
.rn-next { font-size: 15px; color: var(--muted); }
.rn-ctrl { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; max-width: 520px; margin: 0 auto; width: 100%; }
.rn-ctrl .big { background: var(--ph); color: var(--surface); font-size: 18px; }
.rn-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.rn-bar i { display: block; height: 100%; background: var(--ph); }
@media (prefers-reduced-motion: reduce) { .ring .prog { transition: none; } }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } h1 { font-size: 26px; } }
</style>

<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="runner" hidden></div>

<dialog id="sheet"><form id="sheetForm" method="dialog"></form></dialog>

<script>
/* ============================================================
   Élan · appli perso modulaire (sport, organisation, ... langue plus tard)
   Chaque module s'enregistre avec Elan.register({ id, label, icon, render, today }).
   Les données restent sur l'appareil (localStorage).
   ============================================================ */
(function () {
'use strict';

/* ---------- Outils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const fmtLong = (s) => { const d = parseYmd(s); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const fmtShort = (s) => { const d = parseYmd(s); return `${d.getDate()} ${MOIS_C[d.getMonth()]}`; };
const mmss = (sec) => { sec = Math.max(0, Math.ceil(sec)); return sec >= 60 ? `${Math.floor(sec / 60)}:${pad(sec % 60)}` : String(sec); };
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="2" fill="currentColor"/></svg>',
  sport: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M10 2.5h4M18.5 6l1.5-1.5"/></svg>',
  orga: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v17M5 4h11l-2 4 2 4H5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- Données ---------- */
const KEY = 'elan.v1';
function seed() {
  return {
    v: 1,
    settings: { sound: true, voice: true, intensity: 'intense', kneeLevel: 1, calLevel: 1 },
    sport: { done: {}, knee: {}, tests: [] },
    // Progression : l'XP est recalculée depuis l'historique ; seules les pénalités Hard Mode sont stockées.
    prog: { hard: true, start: today(), lastEval: addDays(today(), -1), penalties: {}, debt: { push: 0, plank: 0 }, notice: null },
    goals: [
      { id: uid(), title: "M'inscrire au permis de conduire", deadline: '2026-11-06', done: false, notes: "Objectif : inscription faite la première semaine de novembre.", steps: [
        { id: uid(), text: 'Comparer 2 ou 3 auto-écoles (prix, avis, auto-école en ligne)', done: false },
        { id: uid(), text: "Demander à mon conseiller France Travail les aides au permis et vérifier mes droits CPF (moncompteformation.gouv.fr)", done: false },
        { id: uid(), text: "Préparer les pièces : pièce d'identité, photo-signature numérique (e-photo), justificatif de domicile, attestation JDC si moins de 25 ans", done: false },
        { id: uid(), text: "Faire la demande de numéro NEPH sur le site de l'ANTS (souvent fait par l'auto-école)", done: false },
        { id: uid(), text: "Signer le contrat avec l'auto-école", done: false }
      ] }
    ],
    reminders: [
      { id: uid(), title: 'Actualisation France Travail', date: '2026-10-28', time: '10:00', repeat: 'monthly', note: "Exemple : vérifier la période exacte dans mon espace France Travail.", done: {} },
      { id: uid(), title: 'Envoyer les documents demandés', date: addDays(today(), 1), time: '11:00', repeat: 'none', note: 'Exemple à adapter.', done: {} }
    ]
  };
}
let DB;
function load() {
  try { const raw = localStorage.getItem(KEY); DB = raw ? JSON.parse(raw) : seed(); }
  catch (e) { DB = seed(); }
  const s = seed();
  DB.settings = Object.assign(s.settings, DB.settings || {});
  DB.sport = Object.assign(s.sport, DB.sport || {});
  DB.prog = Object.assign(s.prog, DB.prog || {});
  DB.prog.penalties = DB.prog.penalties || {}; DB.prog.debt = Object.assign({ push: 0, plank: 0 }, DB.prog.debt || {});
  DB.sport.tests = DB.sport.tests || [];
  DB.goals = DB.goals || []; DB.reminders = DB.reminders || [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* stockage indisponible */ } }

/* ---------- Son, voix, écran allumé ---------- */
let actx = null;
function audioUnlock() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep(freq = 880, dur = 0.12, vol = 0.25) {
  if (!DB.settings.sound || !actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; o.type = 'sine'; g.gain.value = vol; o.connect(g); g.connect(actx.destination); const t = actx.currentTime; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.start(t); o.stop(t + dur + 0.02); } catch (e) {}
}
function say(text) {
  if (!DB.settings.voice || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
let wakeLock = null;
async function keepAwake(on) {
  try { if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
}

/* ---------- Registre des modules ---------- */
const modules = [];
const Elan = { register(m) { modules.push(m); }, modules, $, esc, uid, ymd, today, addDays, daysBetween, fmtLong, fmtShort, ICON, get db() { return DB; }, save, rerender: () => render() };
window.Elan = Elan;
let current = 'today';
try { current = sessionStorage.getItem('elan.tab') || 'today'; } catch (e) {}
function go(id) { current = id; try { sessionStorage.setItem('elan.tab', id); } catch (e) {} render(); window.scrollTo(0, 0); }
Elan.go = go;

function render() {
  const tabs = $('#tabs');
  const tabMods = modules.filter(m => m.tab !== false);
  tabs.style.setProperty('--n', tabMods.length);
  tabs.innerHTML = tabMods.map(m => `<button type="button" data-tab="${m.id}" class="${m.id === current ? 'on' : ''}" aria-current="${m.id === current ? 'page' : 'false'}">${m.icon}<span>${esc(m.label)}</span></button>`).join('');
  const mod = tabMods.find(m => m.id === current) || tabMods[0];
  $('#app').innerHTML = mod.render();
  mod.mount && mod.mount($('#app'));
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) go(t.dataset.tab);
});

/* ---------- Feuille de saisie générique ---------- */
function openSheet(html, onSubmit, onMount) {
  const dlg = $('#sheet'), form = $('#sheetForm');
  form.innerHTML = html;
  form.onsubmit = (e) => { e.preventDefault(); const action = e.submitter && e.submitter.value; if (action === 'cancel') { dlg.close(); return; } const fd = Object.fromEntries(new FormData(form)); if (onSubmit(fd, action) !== false) { dlg.close(); save(); render(); } };
  onMount && onMount(form);
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
Elan.openSheet = openSheet;

/* ============================================================
   MOTEUR DE MINUTEUR
   Étapes : { phase: 'prep'|'work'|'rest'|'knee', name, desc, kind: 'time'|'hold'|'reps', dur, reps, hold, relax }
   ============================================================ */
const Runner = (function () {
  let steps = [], i = 0, startTs = 0, pausedAt = 0, paused = false, timer = null, lastSec = null, onFinish = null, title = '', reward = '';
  const R = 130, C = 2 * Math.PI * R;
  function stepDur(s) { return s.kind === 'hold' ? s.reps * (s.hold + s.relax) : s.kind === 'reps' ? Infinity : s.dur; }
  function totalTimed() { return steps.reduce((a, s) => a + (isFinite(stepDur(s)) ? stepDur(s) : 0), 0); }
  function start(list, opts = {}) {
    steps = list; i = 0; title = opts.title || 'Séance'; onFinish = opts.onFinish || null; reward = opts.reward || '';
    audioUnlock(); keepAwake(true);
    $('#runner').hidden = false; document.body.style.overflow = 'hidden';
    begin();
    clearInterval(timer); timer = setInterval(tick, 200);
  }
  function begin() {
    startTs = Date.now(); paused = false; lastSec = null;
    const s = steps[i];
    if (s.phase === 'work' || s.phase === 'knee') { beep(1320, 0.25); say(s.name + (s.kind === 'reps' ? `, ${s.reps} répétitions` : '')); }
    else if (s.phase === 'rest') { beep(660, 0.25); const n = steps[i + 1]; say(n ? `Repos. Ensuite : ${n.name}` : 'Repos'); }
    else if (s.phase === 'prep') { say(`${title}. Première étape : ${s.next || ''}`); }
    draw();
  }
  function elapsed() { return ((paused ? pausedAt : Date.now()) - startTs) / 1000; }
  function tick() {
    if (paused) return;
    const s = steps[i]; if (!s) return;
    const d = stepDur(s), el = elapsed();
    if (isFinite(d)) {
      const left = d - el, sec = Math.ceil(left);
      if (s.kind === 'hold') {
        const cyc = s.hold + s.relax, k = Math.floor(el / cyc), inCyc = el - k * cyc;
        const ph = inCyc < s.hold ? 'serre' : 'relâche';
        if (ph !== s._ph) { s._ph = ph; beep(ph === 'serre' ? 990 : 520, 0.1, 0.18); }
      } else if (sec !== lastSec && sec <= 3 && sec >= 1) beep(880, 0.1);
      lastSec = sec;
      if (left <= 0) return next();
    }
    draw();
  }
  function next() { if (i < steps.length - 1) { i++; begin(); } else finish(); }
  function prev() { if (elapsed() > 3 || i === 0) begin(); else { i--; begin(); } }
  function toggle() { if (paused) { startTs += Date.now() - pausedAt; paused = false; } else { pausedAt = Date.now(); paused = true; } draw(); }
  function stop() { clearInterval(timer); keepAwake(false); try { speechSynthesis.cancel(); } catch (e) {} $('#runner').hidden = true; document.body.style.overflow = ''; }
  function finish() {

(function () {
  const REPEAT = { none: 'Une fois', daily: 'Tous les jours', weekdays: 'Du lundi au vendredi', weekly: 'Chaque semaine', monthly: 'Chaque mois' };
  function occursOn(r, d) {
    if (!r.date || d < r.date) return r.repeat === 'none' ? false : !r.date;
    const a = parseYmd(r.date), b = parseYmd(d);
    switch (r.repeat) {

        <div class="row"><button type="button" class="ghost" data-gedit="${g.id}">Modifier</button>${!g.done ? `<button type="button" class="ghost" data-gdone="${g.id}">Objectif atteint</button>` : ''}${g.deadline && !inFrame ? `<button type="button" class="ghost" data-gics="${g.id}">Ajouter au calendrier</button>` : ''}</div>`
        : nextStep ? `<p class="small"><span class="muted">Prochaine étape :</span> ${esc(nextStep.text)}</p>` : ''}</div>`;

  /* Export calendrier (.ics) : l'app Calendrier de l'iPhone se charge de l'alerte. */

        <section class="section"><div class="row spread"><h2>Objectifs</h2><button type="button" class="primary" data-act="newG">+ Objectif</button></div>
          ${activeGoals().map(g => goalCard(g, t, true)).join('') || '<div class="card"><p class="muted">Aucun objectif en cours.</p></div>'}
          ${doneGoals.length ? `<details class="card"><summary><strong>Objectifs atteints (${doneGoals.length})</strong></summary>${doneGoals.map(g => `<p class="small">${esc(g.title)} <button type="button" class="link" data-gedit="${g.id}">Modifier</button></p>`).join('')}</details>` : ''}</section>
        <section class="section"><div class="row spread"><h2>Rappels</h2><button type="button" class="primary" data-act="newR">+ Rappel</button></div>
          <div class="card"><p class="eyebrow">Aujourd'hui</p>${dueToday(t).map(r => reminderRow(r, t, false)).join('') || '<p class="muted small">Rien aujourd\'hui.</p>'}</div>
          <div class="card"><p class="eyebrow">14 prochains jours</p>${up.map(({ r, d }) => reminderRow(r, d, true)).join('') || '<p class="muted small">Rien de prévu.</p>'}</div>
          <p class="note">${inFrame ? 'Les rappels s\'affichent quand tu ouvres l\'appli.' : 'Les rappels s\'affichent quand tu ouvres l\'appli. Pour recevoir une alerte sur l\'iPhone même appli fermée, ouvre un rappel et touche « Calendrier » : il s\'ajoute à l\'app Calendrier avec une alerte.'}</p></section>`;
    },
    mount(el) { bind(el); }
  });
  Elan.occursOn = occursOn;
})();

/* ============================================================
   MODULE : PROGRESSION (XP, niveau, quêtes du jour, série, Hard Mode)
   Pas d'onglet : s'affiche en tête de « Aujourd'hui ».
   L'XP est recalculée depuis l'historique : décocher une tâche retire l'XP gagnée.
   ============================================================ */
(function () {
  const XP = { workout: 30, knee: 20, reminders: 15, allQuests: 20, step: 10, goal: 100, test: 50 };
  const PENALTY = 50, DEBT = { push: 10, plank: 30 }, DEBT_MAX = { push: 50, plank: 180 };
  const remindersOn = (d) => DB.reminders.filter(r => Elan.occursOn(r, d));
  function quests(d) {
    const q = [
      { label: 'Séance de sport', xp: XP.workout, ok: !!DB.sport.done[d], act: 'workout' },
      { label: 'Routine genou', xp: XP.knee, ok: !!DB.sport.knee[d], act: 'knee' }
    ];
    const rs = remindersOn(d);
    if (rs.length) q.push({ label: `Rappels du jour (${rs.filter(r => r.done[d]).length}/${rs.length})`, xp: XP.reminders, ok: rs.every(r => r.done[d]) });
    return q;
  }
  const complete = (d) => quests(d).every(q => q.ok);
  function dayXp(d) {
    let x = 0;
    quests(d).forEach(q => { if (q.ok) x += q.xp; });
    if (complete(d)) x += XP.allQuests;
    let steps = 0; DB.goals.forEach(g => (g.steps || []).forEach(s => { if (s.done && s.doneAt === d) steps++; }));
    x += Math.min(3, steps) * XP.step;
    x += DB.goals.filter(g => g.done && g.doneAt === d).length * XP.goal;
    if (DB.sport.tests.some(t => t.date === d)) x += XP.test;
    return x;
  }
  function totalXp() {
    const days = new Set([...Object.keys(DB.sport.done), ...Object.keys(DB.sport.knee)]);
    DB.reminders.forEach(r => Object.keys(r.done || {}).forEach(d => days.add(d)));
    DB.goals.forEach(g => { if (g.doneAt) days.add(g.doneAt); (g.steps || []).forEach(s => { if (s.doneAt) days.add(s.doneAt); }); });
    DB.sport.tests.forEach(t => days.add(t.date));
    let x = 0; days.forEach(d => { x += dayXp(d); });
    Object.values(DB.prog.penalties).forEach(p => { x -= p; });
    return Math.max(0, x);
  }
  const need = (L) => 100 + 25 * (L - 1); // XP pour passer du niveau L au suivant
  function levelOf(xp) { let L = 1, base = 0; while (xp >= base + need(L)) { base += need(L); L++; } return { L, into: xp - base, need: need(L) }; }
  function streak() { const t = today(); let d = complete(t) ? t : addDays(t, -1), n = 0; while (n < 3650 && complete(d)) { n++; d = addDays(d, -1); } return n; }
  // Bilan des jours écoulés depuis la dernière ouverture : en Hard Mode, chaque jour raté coûte de l'XP et ajoute une dette.
  Elan.newDay = function () {
    const P = DB.prog, t = today();
    let d = addDays(P.lastEval || addDays(t, -1), 1);
    if (daysBetween(d, t) > 60) d = addDays(t, -60);
    const missed = [];
    for (; d < t; d = addDays(d, 1)) {
      if (d < P.start || P.penalties[d] != null || complete(d)) continue;
      missed.push(d);
      if (P.hard) {
        P.penalties[d] = PENALTY;
        P.debt.push = Math.min(DEBT_MAX.push, P.debt.push + DEBT.push);
        P.debt.plank = Math.min(DEBT_MAX.plank, P.debt.plank + DEBT.plank);
      }
    }
    P.lastEval = addDays(t, -1);
    if (missed.length) P.notice = { days: missed.concat(P.notice ? P.notice.days : []).sort(), hard: P.hard };
  };

  Elan.register({
    id: 'prog', label: 'Progression', tab: false, todayOrder: 10,
    today(t) {
      const P = DB.prog, xp = totalXp(), lv = levelOf(xp), q = quests(t), nOk = q.filter(x => x.ok).length, left = q.length - nOk;
      let notice = '';
      if (P.notice) {
        const n = P.notice, days = n.days.map(fmtShort).join(', ');
        notice = `<div class="card hard-card"><p class="eyebrow" style="color:var(--warn)">${n.hard ? 'Hard Mode' : 'Série perdue'}</p>
          <p>${n.days.length > 1 ? 'Quêtes ratées les' : 'Quêtes ratées le'} ${esc(days.replace(/\.$/, ''))}.${n.hard ? ` −${PENALTY * n.days.length} XP, série remise à zéro, et ta prochaine séance commence par la dette.` : ' Ta série repart de zéro.'}</p>
          <button type="button" class="ghost" data-act="ackNotice">Compris</button></div>`;
      }
      return `<section class="section">${notice}
        <div class="card"><div class="row spread" style="align-items:flex-end"><div><p class="eyebrow">Niveau</p><p class="lvl">${lv.L}</p></div><div style="text-align:right"><p class="eyebrow">Série</p><p class="lvl">${streak()} j</p></div></div>
          <div class="bar xp" role="progressbar" aria-label="XP vers le niveau suivant" aria-valuenow="${lv.into}" aria-valuemin="0" aria-valuemax="${lv.need}"><i style="width:${(lv.into / lv.need * 100).toFixed(1)}%"></i></div>
          <p class="muted small">${lv.into} / ${lv.need} XP avant le niveau ${lv.L + 1} · ${xp} XP au total</p></div>
        <div class="card"><div class="row spread"><h3>Quêtes du jour</h3><span class="pill ${left ? '' : 'ok'}">${nOk}/${q.length}</span></div>
          <div>${q.map(x => `<div class="item ${x.ok ? 'done' : ''}"><span class="check ${x.ok ? 'on' : ''}" aria-hidden="true">${x.ok ? ICON.check : ''}</span><div><p class="t">${esc(x.label)}</p><p class="muted small">+${x.xp} XP</p></div>${!x.ok && x.act ? `<button type="button" class="link" data-act="${x.act}">Lancer</button>` : '<span></span>'}</div>`).join('')}</div>
          <p class="muted small">${left ? `Toutes les quêtes : +${XP.allQuests} XP de bonus.` : `Journée validée : +${XP.allQuests} XP de bonus.`} Chaque étape d'objectif cochée : +${XP.step} XP. Objectif atteint : +${XP.goal} XP.</p>
          ${P.hard && left ? `<p class="small" style="color:var(--warn);font-weight:700">Hard Mode : s'il en reste à minuit, −${PENALTY} XP, série à zéro et ${DEBT.push} pompes plus ${DEBT.plank} s de planche en dette.</p>` : ''}</div></section>`;
    },
    mountToday(el) {
      el.querySelectorAll('[data-act="ackNotice"]').forEach(b => b.onclick = () => { DB.prog.notice = null; save(); render(); });
    }
  });
})();

/* ============================================================
   MODULE : RÉGLAGES (son, voix, sauvegarde)
   ============================================================ */
Elan.register({
  id: 'settings', label: 'Réglages', icon: ICON.settings,
  render() {
    const s = DB.settings;
    return `<header class="stack"><p class="eyebrow">Réglages</p><h1>Réglages</h1></header>
      <section class="section"><div class="card">
        <label class="row spread" for="sSound" style="display:flex">Bips du minuteur<input id="sSound" type="checkbox" ${s.sound ? 'checked' : ''} style="width:auto;min-height:0"></label>
        <label class="row spread" for="sVoice" style="display:flex">Annonce vocale des exercices<input id="sVoice" type="checkbox" ${s.voice ? 'checked' : ''} style="width:auto;min-height:0"></label>
        <p class="muted small">Sur iPhone, coupe le mode silencieux pour entendre les bips.</p></div></section>
      <section class="section"><h2>Progression</h2><div class="card">
        <label class="row spread" for="sHard" style="display:flex">Hard Mode<input id="sHard" type="checkbox" ${DB.prog.hard ? 'checked' : ''} style="width:auto;min-height:0"></label>
        <p class="muted small">Quêtes du jour pas finies à minuit : −50 XP, série remise à zéro, et 10 pompes plus 30 s de planche ajoutées au début de la séance suivante.</p></div></section>
      <section class="section"><h2>Sauvegarde</h2><div class="card">
        <p class="small">Tes données restent sur ce téléphone. Copie une sauvegarde de temps en temps (dans Notes par exemple) pour ne rien perdre.</p>
        <button type="button" id="bCopy">Copier la sauvegarde</button>
        <label for="bImport">Restaurer : colle une sauvegarde ici<textarea id="bImport" placeholder='{"v":1,...}'></textarea></label>
        <button type="button" id="bRestore" class="ghost">Restaurer</button>
        <p class="small" id="bMsg" role="status"></p></div></section>
      <section class="section"><h2>Remettre à zéro</h2><div class="card"><p class="small muted">Efface tout et remet les exemples du départ.</p>
        <button type="button" id="bReset" class="ghost danger">Tout effacer</button><button type="button" id="bResetOk" class="danger" hidden>Confirmer l'effacement</button></div></section>
      <p class="muted small">Élan · version 0.2 · les modules (langue, etc.) s'ajouteront ici au fil du temps.</p>`;
  },
  mount(el) {
    $('#sSound').onchange = (e) => { DB.settings.sound = e.target.checked; save(); };
    $('#sVoice').onchange = (e) => { DB.settings.voice = e.target.checked; save(); };
    $('#sHard').onchange = (e) => { DB.prog.hard = e.target.checked; save(); };
    const msg = (t) => { $('#bMsg').textContent = t; };
    $('#bCopy').onclick = () => { const txt = JSON.stringify(DB); navigator.clipboard && navigator.clipboard.writeText(txt).then(() => msg('Sauvegarde copiée. Colle-la dans Notes.'), () => { $('#bImport').value = txt; $('#bImport').select(); msg('Copie automatique refusée : le texte est sélectionné ci-dessus, copie-le.'); }); };
    $('#bRestore').onclick = () => { try { const d = JSON.parse($('#bImport').value); if (!d || !d.goals || !d.reminders) throw 0; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e2) {} DB = d; load(); DB = d.goals ? Object.assign(DB, { goals: d.goals, reminders: d.reminders }) : DB; save(); msg('Sauvegarde restaurée.'); render(); } catch (e) { msg('Ce texte n\'est pas une sauvegarde Élan valide. Vérifie que tu l\'as collé en entier.'); } };
    $('#bReset').onclick = () => { $('#bResetOk').hidden = false; };
    $('#bResetOk').onclick = () => { DB = seed(); save(); render(); };
  }
});

/* ---------- Démarrage ---------- */
load(); Elan.newDay(); save(); render();
// Recalcule la vue si la journée change pendant que l'appli est ouverte.
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); Elan.newDay(); save(); if ($('#runner').hidden) render(); } });
// Mode hors ligne quand l'appli est installée (ignoré dans un aperçu).
if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
